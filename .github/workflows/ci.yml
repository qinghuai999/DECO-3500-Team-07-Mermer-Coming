name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Test bot and deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Restrict manual deployment to main
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Select main when running Deploy EC2.'
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: discord-example-app/package-lock.json
      - name: Install dependencies
        working-directory: discord-example-app
        run: npm ci
      - name: Test Discord interactions (mocked API)
        working-directory: discord-example-app
        run: npm test
      - name: Check shell scripts
        run: bash -n scripts/deploy-main.sh scripts/setup-github-auth.sh
      - name: Test deployment and CI helpers (no AWS calls)
        run: python3 -m unittest discover -s scripts/test -p 'test_*.py' -v
